# Observed on 2026-10-17: host Nginx -> Docker gateway -> frontend.
# Recheck this address after recreating the network or adding another proxy.
geo $realip_remote_addr $monipan_trusted_edge {
    default 0;
    172.18.0.1/32 1;
}

set_real_ip_from 172.18.0.1;
real_ip_header X-Real-IP;
real_ip_recursive off;
