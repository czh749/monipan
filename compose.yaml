x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MONIPAN_MYSQL_DATABASE:-monipan}
      MYSQL_USER: ${MONIPAN_MYSQL_USER:-monipan}
      MYSQL_PASSWORD: ${MONIPAN_MYSQL_PASSWORD:-monipan_local_only}
      MYSQL_ROOT_PASSWORD: ${MONIPAN_MYSQL_ROOT_PASSWORD:-root_local_only}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - monipan-mysql-data:/var/lib/mysql
    expose:
      - "3306"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    environment:
      MONIPAN_ENVIRONMENT: ${MONIPAN_ENVIRONMENT:-development}
      MONIPAN_DATABASE_URL: mysql+pymysql://${MONIPAN_MYSQL_USER:-monipan}:${MONIPAN_MYSQL_PASSWORD:-monipan_local_only}@mysql:3306/${MONIPAN_MYSQL_DATABASE:-monipan}?charset=utf8mb4
      MONIPAN_DISABLE_MARKET_LOOP: ${MONIPAN_DISABLE_MARKET_LOOP:-0}
      MONIPAN_MARKET_INTERVAL: "300"
      MONIPAN_HISTORY_INITIAL_DELAY: "90"
      MONIPAN_HISTORY_INTERVAL: "4"
      MONIPAN_HISTORY_FAILURE_INTERVAL: "20"
      # Local HTTP deployment. Set to "1" together with HTTPS in production.
      MONIPAN_COOKIE_SECURE: ${MONIPAN_COOKIE_SECURE:-0}
      MONIPAN_SESSION_DAYS: ${MONIPAN_SESSION_DAYS:-7}
      MONIPAN_REGISTER_IP_LIMIT: ${MONIPAN_REGISTER_IP_LIMIT:-3}
      MONIPAN_REGISTER_WINDOW_SECONDS: ${MONIPAN_REGISTER_WINDOW_SECONDS:-3600}
      MONIPAN_LOGIN_IP_LIMIT: ${MONIPAN_LOGIN_IP_LIMIT:-10}
      MONIPAN_LOGIN_IP_WINDOW_SECONDS: ${MONIPAN_LOGIN_IP_WINDOW_SECONDS:-60}
      MONIPAN_LOGIN_FAILURE_LIMIT: ${MONIPAN_LOGIN_FAILURE_LIMIT:-5}
      MONIPAN_LOGIN_FAILURE_WINDOW_SECONDS: ${MONIPAN_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      MONIPAN_AI_USER_24H_LIMIT: ${MONIPAN_AI_USER_24H_LIMIT:-5}
      MONIPAN_AI_IP_HOURLY_LIMIT: ${MONIPAN_AI_IP_HOURLY_LIMIT:-20}
      MONIPAN_AI_GLOBAL_CONCURRENCY: ${MONIPAN_AI_GLOBAL_CONCURRENCY:-2}
      MONIPAN_AI_CONCURRENCY_TTL_SECONDS: ${MONIPAN_AI_CONCURRENCY_TTL_SECONDS:-180}
      MONIPAN_DOCUMENT_MAX_BYTES: ${MONIPAN_DOCUMENT_MAX_BYTES:-26214400}
      MONIPAN_DOCUMENT_MAX_PAGES: ${MONIPAN_DOCUMENT_MAX_PAGES:-500}
      MONIPAN_DOCUMENT_CHUNK_TARGET_CHARS: ${MONIPAN_DOCUMENT_CHUNK_TARGET_CHARS:-700}
      MONIPAN_DOCUMENT_CHUNK_MAX_CHARS: ${MONIPAN_DOCUMENT_CHUNK_MAX_CHARS:-900}
      MONIPAN_DOCUMENT_CHUNK_OVERLAP_CHARS: ${MONIPAN_DOCUMENT_CHUNK_OVERLAP_CHARS:-80}
      MONIPAN_NEWS_PROVIDER: ${MONIPAN_NEWS_PROVIDER:-tavily}
      MONIPAN_NEWS_TIMEOUT_SECONDS: ${MONIPAN_NEWS_TIMEOUT_SECONDS:-12}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MONIPAN_AGENT_MODEL_PROVIDER: ${MONIPAN_AGENT_MODEL_PROVIDER:-DEEPSEEK}
      MONIPAN_AGENT_MODEL: ${MONIPAN_AGENT_MODEL:-deepseek-v4-flash}
      MONIPAN_AGENT_API_KEY: ${MONIPAN_AGENT_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MONIPAN_AGENT_BASE_URL: ${MONIPAN_AGENT_BASE_URL:-https://api.deepseek.com}
      MONIPAN_AGENT_STRUCTURED_METHOD: ${MONIPAN_AGENT_STRUCTURED_METHOD:-function_calling}
      MONIPAN_AGENT_TIMEOUT_SECONDS: ${MONIPAN_AGENT_TIMEOUT_SECONDS:-90}
      MONIPAN_AGENT_MAX_OUTPUT_TOKENS: ${MONIPAN_AGENT_MAX_OUTPUT_TOKENS:-4096}
      MONIPAN_AGENT_MAX_CONTEXT_CHARS: ${MONIPAN_AGENT_MAX_CONTEXT_CHARS:-80000}
      MONIPAN_AGENT_RETRY_MAX_CONTEXT_CHARS: ${MONIPAN_AGENT_RETRY_MAX_CONTEXT_CHARS:-40000}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    stop_grace_period: 5m
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  monipan-mysql-data:
