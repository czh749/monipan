services:
  backend:
    build:
      context: ./backend
    environment:
      MONIPAN_DATABASE_URL: sqlite:////app/data/monipan.db
      MONIPAN_MARKET_INTERVAL: "300"
    volumes:
      - monipan-data:/app/data
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  monipan-data:
