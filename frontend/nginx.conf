limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=ai_analysis:10m rate=2r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    include /etc/nginx/monipan-security-headers.conf;

    limit_req_status 429;

    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        include /etc/nginx/monipan-security-headers.conf;
        add_header Retry-After 60 always;
        return 429 '{"detail":{"code":"EDGE_RATE_LIMITED","message":"请求过于频繁，请稍后重试"}}';
    }

    location = /api/market/tick {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/auth/register {
        limit_req zone=auth_register burst=2 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/agent/stocks/[^/]+/analyze$ {
        limit_req zone=ai_analysis burst=1 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /livez {
        proxy_pass http://backend:8000/livez;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /readyz {
        limit_req zone=api_general burst=20 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass http://backend:8000/readyz;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /docs {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    location /assets/ {
        include /etc/nginx/monipan-security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
